[package]
name = "gcloud-auth"
version = "1.3.0"
authors = ["yoshidan <naohiro.y@gmail.com>"]
edition = "2021"
repository = "https://github.com/yoshidan/google-cloud-rust/tree/main/foundation/auth"
keywords = ["gcp", "auth", "googleapis", "google-cloud-rust"]
license = "MIT"
readme = "README.md"
description = "Google Cloud Platform server application authentication library."

[lib]
doctest = false

[dependencies]
tracing = "0.1.41"
reqwest = { version = "0.13", features = ["json", "charset", "form"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145" }
jsonwebtoken = { version = "10.2", features = ["use_pem"], default-features = false }
thiserror = "2.0.18"
async-trait = "0.1.89"
home = "0.5"
urlencoding = "2.1"
tokio = { version = "1.47.1", features = ["fs"] }
google-cloud-metadata = { package = "gcloud-metadata", version = "1.0.2", path = "../metadata" }
token-source = "1.0"
base64 = "0.22"
time = "0.3.44"

url = { version = "2.5.4", optional = true }
path-clean = { version = "1.0", optional = true }
sha2 = { version = "0.10.9", optional = true }
percent-encoding = { version = "2.3.1", optional = true }
hmac = { version = "0.12", optional = true }
hex = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["test-util", "rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "std"] }
ctor = "0.5"
tempfile = "3.25.0"
temp-env = { version = "0.3.6", features = ["async_closure"] }

[features]
default = ["rustls-tls", "jwt-aws-lc-rs"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
rustls-no-provider = ["reqwest/rustls-no-provider"]
hickory-dns = ["reqwest/hickory-dns"]
external-account = ["sha2", "path-clean", "url", "percent-encoding", "hmac", "hex"]
jwt-aws-lc-rs = ["jsonwebtoken/aws_lc_rs"]
jwt-rust-crypto = ["jsonwebtoken/rust_crypto"]
